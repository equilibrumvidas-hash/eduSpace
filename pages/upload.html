<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upload — EduSpace</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>

<body>

<header class="navbar">

    <a href="../index.html" class="logo">
        Edu<span>Space</span>
    </a>

    <nav class="nav-links">

        <a href="../index.html">
            Home
        </a>

        <a href="courses.html">
            Courses
        </a>

        <a href="upload.html" class="active">
            Upload
        </a>

    </nav>

</header>


<main>

<section class="section">

    <span class="section-label">
        CREATOR STUDIO
    </span>

    <h1
        style="
            font-size: clamp(45px, 7vw, 80px);
            letter-spacing: -4px;
            margin-top: 15px;
        "
    >
        Upload content.
    </h1>

    <p
        style="
            max-width: 650px;
            color: #94a3b8;
            line-height: 1.8;
            margin-top: 20px;
        "
    >
        Create educational content and share
        your knowledge with learners.
    </p>


    <form
        class="upload-form"
        id="uploadForm"
        style="
            max-width: 800px;
            margin-top: 50px;
        "
    >

        <label>
            Title

            <input
                type="text"
                id="uploadTitle"
                placeholder="Enter content title"
                required
            >

        </label>


        <label>
            Description

            <textarea
                id="uploadDescription"
                placeholder="Describe your content..."
                rows="6"
                required
            ></textarea>

        </label>


        <label>
            Content type

            <select id="uploadType">

                <option value="video">
                    Video
                </option>

                <option value="image">
                    Image
                </option>

                <option value="course">
                    Course
                </option>

            </select>

        </label>


        <label>
            File

            <input
                type="file"
                id="uploadFile"
                accept="video/*,image/*"
            >

        </label>


        <button
            type="submit"
            class="btn btn-primary"
        >
            Upload Content →
        </button>

    </form>

</section>

</main>


<script>

    const form =
        document.getElementById("uploadForm");

    form.addEventListener(
        "submit",
        event => {

            event.preventDefault();

            const title =
                document.getElementById(
                    "uploadTitle"
                ).value;

            alert(
                `"${title}" is ready to be uploaded.`
            );

        }
    );

</script>

</body>
</html>
